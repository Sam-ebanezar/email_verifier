<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register - Email Verifier</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f7fa;
      display: flex;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .register-container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
      width: 320px;
      box-sizing: border-box;
      text-align: center;
    }
    h2 {
      margin-bottom: 24px;
      font-weight: 700;
      color: #333;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px 15px;
      border: none;
      border-radius: 8px;
      background-color: #3a86ff;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #2f6fcc;
    }
    .message {
      margin-top: 15px;
      font-size: 13px;
    }
    .error {
      color: #d9534f;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h2>Register</h2>

    {% with messages = get_flashed_messages(category_filter=["error"]) %}
      {% if messages %}
        <div class="message error">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('register') }}">
      <input type="text" name="username" placeholder="Username" autofocus required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Register</button>
    </form>

    <div class="message">
      Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </div>
  </div>
</body>
</html>
